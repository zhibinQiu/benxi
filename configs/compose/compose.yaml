# 企业 AI 知识库平台 — 统一容器栈（基础编排文件）
#
# 编排入口: bash scripts/stack.sh  或  ./dev.sh docker
# 文档: docs/zh/operations/config-and-scripts.md
#
# 文件合并顺序（后者覆盖前者）:
#   1. compose.yaml              ← 本文件（核心服务）
#   2. compose.mirror.yaml       ← STACK_USE_MIRROR=1 时（国内镜像）
#   3. third_party/deploy/knowflow.yml       ← --profile knowflow
#   4. third_party/deploy/knowflow.mirror.yaml ← 镜像加速
#   5. compose.dev.yaml          ← stack.sh dev-up（热重载）
# 对外: 仅 frontend:${FRONTEND_PORT}（默认 40005）
# profile: knowflow（MySQL/Infinity/RAGFlow）· speech（FunASR）· docs（MkDocs 文档站）
#
# FireCrawl 自托管（独立 compose 项目，挂 benxi 网络）:
#   docker compose -f configs/compose/compose.firecrawl.yaml up -d

name: benxi

services:
  # --- 数据层（不映射主机端口）---
  # 统一 PostgreSQL 16（Alpine）；镜像名由 POSTGRES_IMAGE 控制
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - ${DATA_ROOT:-../../data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 单机生产档位 C：预留 API 6×(12+8) + Celery (10+5) + 余量
    command: postgres -c max_connections=220 -c shared_buffers=512MB
    networks:
      - benxi

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benxi

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DATA_ROOT:-../../data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - benxi

  # --- PDF 翻译 API（BabelDOC / pdf2zh）---
  pdf2zh-api:
    image: ${PDF2ZH_IMAGE:-benxi-pdf2zh:${BENXI_VERSION:-4.9.0}}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${PDF2ZH_BASE_IMAGE:-ghcr.io/astral-sh/uv:python3.13-bookworm-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        import logging
        from rich.logging import RichHandler
        logging.basicConfig(level=logging.INFO, handlers=[RichHandler()])
        from babeldoc.assets import assets as bassets
        bassets.warmup()
        from pdf2zh_next.api_server import run_api_server
        run_api_server(host="0.0.0.0", port=7861)
    volumes:
      - ${DATA_ROOT:-../../data}/pdf2zh-config:/root/.config/pdf2zh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/api/health')\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 180s
    networks:
      - benxi

  # --- 平台 API（FastAPI）与 Celery Worker，共用 benxi-api 镜像 ---
  api:
    image: benxi-api:${BENXI_VERSION:-4.9.0}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: production
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        INSTALL_PAGEINDEX: ${INSTALL_PAGEINDEX:-1}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PDF2ZH_API_URL: http://pdf2zh-api:7861
      SPEECH_SERVICE_URL: http://speech-api:8765
      KNOWFLOW_ENABLED: ${KNOWFLOW_ENABLED:-false}
      KNOWFLOW_BACKEND_URL: http://knowflow-backend:5000
      RAGFLOW_API_URL: http://ragflow:80
      RAGFLOW_MYSQL_HOST: knowflow-mysql
      # 单机生产档位 C（200 在线 / 瞬时 ~100–150 打 DB）；见 docs/zh/operations/configuration.md
      DB_POOL_SIZE: "12"
      DB_MAX_OVERFLOW: "8"
      DB_POOL_TIMEOUT: "15"
      STREAM_MAX_CONCURRENT_PER_WORKER: "12"
      STREAM_ACQUIRE_TIMEOUT: "5"
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHDB_URL: ${GRAPHDB_URL:-http://graphdb:7200}
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-benxi-ontology}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      pdf2zh-api:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      graphdb:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-../../data}/pageindex:/app/.run/pageindex
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 6
    mem_limit: 4g
    shm_size: "512mb"
    networks:
      - benxi

  worker:
    image: benxi-api:${BENXI_VERSION:-4.9.0}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: production
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        INSTALL_PAGEINDEX: ${INSTALL_PAGEINDEX:-1}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PDF2ZH_API_URL: http://pdf2zh-api:7861
      SPEECH_SERVICE_URL: http://speech-api:8765
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHDB_URL: ${GRAPHDB_URL:-http://graphdb:7200}
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-benxi-ontology}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      neo4j:
        condition: service_healthy
      graphdb:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-../../data}/pageindex:/app/.run/pageindex
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=12
    shm_size: "512mb"
    networks:
      - benxi

  # --- 唯一对外 Web 入口（生产 Nginx；dev 见 compose.dev.yaml 的 Vite）---
  frontend:
    image: benxi-frontend:${BENXI_VERSION:-4.9.0}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        ALPINE_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        VITE_API_BASE: ${VITE_API_BASE:-/ai}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/ai/}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DESIGN_SYSTEM_UPSTREAM: ${DESIGN_SYSTEM_UPSTREAM:-http://host.docker.internal:40001}
      DESIGN_SYSTEM_HOST: ${DESIGN_SYSTEM_HOST:-172.19.134.45:40001}
    ports:
      - "${FRONTEND_PORT:-40005}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - benxi

  # --- profile speech: FunASR 会议转写（模型卷 data/speech-models）---
  speech-api:
    profiles: ["speech"]
    image: ${SPEECH_IMAGE:-benxi-speech:${BENXI_VERSION:-4.9.0}}
    build:
      context: ../../third_party/speech-service
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${SPEECH_PYTHON_IMAGE:-python:3.11-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    environment:
      FUNASR_ASR_MODEL: ${FUNASR_ASR_MODEL:-paraformer-zh}
      FUNASR_VAD_MODEL: ${FUNASR_VAD_MODEL:-fsmn-vad}
      FUNASR_PUNC_MODEL: ${FUNASR_PUNC_MODEL:-ct-punc}
      FUNASR_SPK_MODEL: ${FUNASR_SPK_MODEL:-cam++}
      FUNASR_DEVICE: ${FUNASR_DEVICE:-cpu}
      FUNASR_HUB: ms
      SPEECH_MODELS_DIR: /models
      MODELSCOPE_CACHE: /models
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED:-true}
      MAX_FILE_MB: ${SPEECH_MAX_FILE_MB:-100}
    volumes:
      - ${DATA_ROOT:-../../data}/speech-models:/models
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 300s
    networks:
      - benxi

  # --- profile docs: MkDocs Material 系统文档（开发/内网预览）---
  docs:
    profiles: ["docs"]
    image: benxi-docs:${BENXI_VERSION:-4.9.0}
    build:
      context: ../..
      dockerfile: docs/Dockerfile
      args:
        PYTHON_IMAGE: ${DOCS_PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCS_PORT:-40100}:8000"
    volumes:
      - ../../configs/mkdocs.yml:/site/mkdocs.yml:ro
      - ../../docs/zh:/docs/zh:ro
      - ../../icon:/icon:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - benxi

  # --- 知识图谱：Neo4j 实例层（ABox）+ GraphDB 本体层（TBox，全局共享）---
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    container_name: benxi-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGE_CACHE:-512M}
      # Browser 远程连接时发现接口需广告对外端口（默认与 40012/40013 映射一致）
      NEO4J_server_bolt_advertised__address: ${NEO4J_BOLT_ADVERTISED:-0.0.0.0:40012}
      NEO4J_server_http_advertised__address: ${NEO4J_HTTP_ADVERTISED:-0.0.0.0:40013}
    ports:
      # 知识图谱 Neo4j Browser / Bolt：主机 40012→7687、40013→7474（均高于 GraphDB 40011）
      - "${REMOTE_NEO4J_PORT:-40012}:7687"
      - "${REMOTE_NEO4J_HTTP_PORT:-40013}:7474"
    volumes:
      - ${DATA_ROOT:-../../data}/neo4j/data:/data
      - ${DATA_ROOT:-../../data}/neo4j/logs:/logs
      - ${DATA_ROOT:-../../data}/neo4j/import:/import
      - ${DATA_ROOT:-../../data}/neo4j/backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-changeme} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - benxi

  graphdb:
    image: ${GRAPHDB_IMAGE:-ontotext/graphdb:10.7.1}
    container_name: benxi-graphdb
    restart: unless-stopped
    environment:
      GDB_HEAP_SIZE: ${GRAPHDB_HEAP_SIZE:-1g}
    ports:
      # 本体 GraphDB Workbench / SPARQL：主机 40011 → 容器 7200
      - "${REMOTE_GRAPHDB_PORT:-40011}:7200"
    volumes:
      - ${DATA_ROOT:-../../data}/graphdb:/opt/graphdb/home
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:7200/rest/repositories || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - benxi

networks:
  benxi:
    name: benxi
    driver: bridge
